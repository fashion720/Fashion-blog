name: Sara Khan
bio: 'Lead Fashion Writer and Style Editor at Outfit Edits, specializing in practical wardrobe curation, seasonal trend breakdowns, and everyday outfit styling. Drawing on years of independent fashion research and garment pairing analysis, Sara tests and reviews outfit combinations around real, versatile wardrobe staples. Her editorial approach is grounded in realistic styling—focusing on proportion, color harmony, and fit—to deliver actionable guidance readers can directly adapt to their personal closets.'
