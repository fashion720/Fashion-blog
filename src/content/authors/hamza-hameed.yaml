name: Hamza Hameed
bio: >-
  Hamza Hameed is the founder of Outfit Edits, where he writes about everyday
  style for real life: outfit ideas, seasonal dressing, and DIY upcycling. His
  focus is practical, wearable looks built from pieces you already own, with
  clear fit and fabric guidance so each idea works outside the photos. Every
  guide is written to be followed at home, whether that means restyling a
  closet staple or giving an old garment a second life.
