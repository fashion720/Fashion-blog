name: DIY & Upcycling
description: >-
  Some of the most personal outfits begin not in a shop but at a table covered
  in paint, thread and fabric scraps. This collection is for anyone who likes
  making things with their hands, or who wants a wardrobe that no one else can
  copy. You will find step by step projects that turn old clothes into
  something new: bleach designs that give a plain shirt a pattern, painted
  denim that turns a jacket into a keepsake, no sew fixes that rescue a torn
  hem in minutes, and thrift flips that take a second hand find and make it
  feel made for you. Every project is written for real beginners as well as
  confident makers, with honest notes on cost, time and the tools you actually
  need, so you can judge before you start whether a project fits your evening
  or your weekend. Mistakes are treated as part of the craft, not as failure,
  and most guides include a way to fix a wobble or cover a slip so nothing is
  wasted. Upcycling is also a kinder way to dress, keeping good fabric out of
  landfill and giving clothes a second life. Whether you are customising a
  jacket for a special occasion, refreshing a tired wardrobe on a small
  budget, or simply enjoying an afternoon of making, this collection shows you
  how to start, how to finish, and how to wear what you made with pride.
color: '#000000'
