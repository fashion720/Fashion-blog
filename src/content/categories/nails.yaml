name: Nails
description: >-
  A good manicure finishes an outfit the way the right shoes do, and it does
  not have to mean long acrylics or a salon appointment. This collection is
  about nail designs you can actually wear: short nail ideas that survive
  typing and housework, French manicures in every variation from milky and
  clean to deep holiday red, seasonal designs for Christmas, New Year and
  the winter months, and simple nail art that a beginner can genuinely do at
  home. Each guide explains the colours, finishes and shapes involved —
  chrome, cat eye, glossy, matte — and who they suit, from natural and
  elegant everyday looks to full festive sets for a party. Length and shape
  are treated honestly throughout, because a design that only works on very
  long nails is not much use to most people. You will also find care basics
  that keep natural nails strong under polish, so the designs you love last
  longer instead of chipping by day two. Whether you book a salon, use press
  ons or paint your own nails at the kitchen table, these guides give you
  ideas that are current, wearable and matched to the season, with clear
  photos of every design so you know exactly what you are asking for.
color: '#000000'
