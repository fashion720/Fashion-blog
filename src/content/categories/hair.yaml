name: Hair
description: >-
  Great hair is the part of the look people notice first, and it rarely needs
  a salon visit or an hour in front of the mirror. This collection covers
  hairstyles and haircuts that work in real life: short cuts that grow out
  gracefully, bangs that suit your face shape instead of fighting it, braids
  and updos that stay put through a full day, and quick styles for school,
  work and parties when time is short. Every guide starts with the practical
  questions — how much daily styling a cut really needs, whether it suits
  fine, thick, straight or curly hair, and how it looks on different face
  shapes and at different ages. You will find seasonal ideas for winter
  parties and holidays alongside low-maintenance everyday options, with
  honest notes on what a style asks of you before you commit to it. The aim
  throughout is hair that looks intentional without taking over your
  morning: a cut that flatters, a fringe that behaves, and a handful of
  reliable styles you can repeat with confidence. Whether you are planning
  a complete restyle or just want your current hair to work harder, these
  guides give you clear, wearable ideas matched to your hair type, your
  face and your actual routine.
color: '#000000'
