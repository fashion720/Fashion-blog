name: Women's Fashion
description: >-
  Women's fashion is at its best when it fits the woman wearing it, not the
  other way round. This collection brings together outfit ideas, seasonal
  guides and wardrobe inspiration for women of every age, shape and lifestyle,
  from everyday looks you can throw on in five minutes to polished outfits for
  work, celebrations and special occasions. You will find guidance on dressing
  for your body with confidence, choosing colours that flatter your skin,
  layering for comfort in every season, and building a wardrobe where the
  pieces genuinely work together. The advice is practical and honest. Each
  guide explains the fit to look for, the fabric that will feel good all day,
  and the small styling choices, like where a hem should fall or how a belt
  should sit, that turn a good outfit into a great one. There are looks for
  women over forty, for midsize bodies, for busy mornings, for holidays and
  for quiet days at home, because style does not belong to one age or one
  size. The goal is a wardrobe that makes getting dressed a pleasure rather
  than a puzzle. Explore the guides, try the ideas that speak to you, and
  build a style that is comfortable, flattering and unmistakably yours.
color: '#000000'
