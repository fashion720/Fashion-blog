name: Campus Style
description: >-
  Campus life asks a lot of an outfit. It has to survive a full day of lectures,
  a walk across campus in any weather, a study session in the library and an
  evening out, often without a chance to change in between. This collection is
  built for that reality, with outfit ideas for college and high school
  students who want to look put together without spending a fortune or an hour
  in front of the mirror. You will find first day looks that make a good
  impression, classroom layering that adapts as the day warms up, game day
  outfits that show team spirit without looking like a costume, and smart
  casual looks for presentations, interviews and internships. Comfort is
  treated as a style choice, not a compromise, so the guides favour shoes you
  can walk in, bags that actually hold your books and a laptop, and fabrics
  that survive a long day in a chair. There are also ideas for making a small
  wardrobe stretch across the week, remixing the same pieces into fresh looks,
  and adding one new item at a time instead of starting over each term.
  Dressing well at school or college is not about following every trend. It is
  about knowing what suits you, what fits your day, and what lets you focus on
  your work instead of your clothes.
color: '#000000'
