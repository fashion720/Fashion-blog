name: Denim & Basics
description: >-
  Every good wardrobe stands on a small set of reliable pieces, and this
  collection is about getting those foundations right. Denim is the starting
  point, with guides to fits that flatter different body shapes, washes that
  work across seasons, and the small details, like pocket placement and rise,
  that decide whether a pair of jeans feels made for you or merely adequate.
  Alongside denim you will find the basics that carry the rest of your
  wardrobe: plain tees that hold their shape, layering pieces that add warmth
  without bulk, and timeless staples that never look dated. The advice here is
  practical rather than theoretical. Each guide explains how to check a fit in
  the fitting room, how to tell a well made basic from a cheap one, and how to
  combine the same few pieces into outfits that look fresh rather than
  repeated. You will also find ideas for refreshing basics you already own,
  from simple styling tweaks to small repairs that extend the life of a
  favourite piece. A strong foundation means less time deciding what to wear
  and more outfits you actually enjoy. Start with the pieces in this
  collection and the rest of your wardrobe becomes easier to build, easier to
  wear, and easier to love.
color: '#000000'
